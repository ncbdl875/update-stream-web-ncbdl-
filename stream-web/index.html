    /* A. NỀN TOÀN TRANG & FONT CHỮ */
    body {

    /* 📌 🔥 B1. THẺ BADGE NỔI BẬT TRÊN CÙNG (MỚI THÊM) */
    .hot-badge {

      color: #550c5c;

    @keyframes pulseBadge {

    @keyframes floatLogo {

      box-shadow: 0 8px 25px rgba(112, 0, 249, 0.25);

    /* H. NÚT BẤM BÊN PHẢI */

      font-weight: 800;
      letter-spacing: 0.5px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);

    .link-box:hover .btn-action {

    }

    .btn-guide   { background: #7000f9; color: #fff; }

      margin-top: 40px;
      padding-top: 25px;

    }
    .contact-title {
      font-size: 13px;
      font-weight: 900;
      color: #4a0e68;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .social-btn {
      width: 44px;

      display: flex;

      justify-content: center;
      color: #3b0764;
      text-decoration: none;

    .social-btn svg {

      fill: currentColor;

    /* J. BẢNG BẬT RA (POP-UP MODAL) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;

    }

    .modal-content {
      background: #faebfe;
      border: 1px solid rgba(112, 0, 249, 0.3);
      padding: 28px 24px;
      border-radius: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      position: relative;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      animation: popUpAnim 0.25s ease-out;
    }

    @keyframes popUpAnim {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* NÚT TẮT [X] ĐÃ ĐƯỢC CHỈNH MÀU ĐẬM NỔI BẬT */

  <!-- ============================================================
       ⚙️ 3. KHU VỰC XỬ LÝ DỮ LIỆU GOOGLE SHEET (JAVASCRIPT)
       ============================================================ -->
  <script>
    const SHEET_ID = "12vlSoBt24a-u9CWe4G0SvLKi9LpXIOlsKyfpbpsNv6Y";
    const TAB_NAME = "Trang tính1";

    async function fetchLinksFromSheet() {
      const container = document.getElementById('links-container');
      try {
        const response = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(TAB_NAME)}`);
        const rawData = await response.json();

        container.innerHTML = ""; 

        let lastCategory = "";

        rawData.forEach(item => {
          const row = {};
          Object.keys(item).forEach(key => {
            const cleanKey = key.trim().toLowerCase().replace(/\s+/g, '');
            row[cleanKey] = item[key] ? item[key].toString().trim() : "";
          });

          const category = row.category || "";
          const title = row.title || "";
          const link = row.link || "";
          const type = (row.type || "").toLowerCase();
          const buttonText = row.buttontext || row.btntext || "MỞ";
          const content = row.content || "";

          if (!title && !category) return;

          if (category && category !== lastCategory) {
            const catHeader = document.createElement('div');
            catHeader.className = 'category-title';
            catHeader.innerText = category;
            container.appendChild(catHeader);
            lastCategory = category;
          }

          let btnClass = "btn-spotify";
          if (type === 'guide') btnClass = "btn-guide";
          else if (type === 'buy' || type === 'itunes') btnClass = "btn-itunes";
          else if (type === 'store') btnClass = "btn-store";

          const box = document.createElement(type === 'guide' ? 'div' : 'a');
          box.className = 'link-box';

          if (type === 'guide') {
            box.onclick = () => openGuide(title, content, link);
            box.innerHTML = `
              <span>${title}</span>
              <span class="btn-action ${btnClass}">${buttonText}</span>
            `;
          } else {
            box.href = link;
            box.target = '_blank';
            box.innerHTML = `
              <span>${title}</span>
              <span class="btn-action ${btnClass}">${buttonText}</span>
            `;
          }
          container.appendChild(box);
        });

      } catch (error) {
        console.error("Lỗi tải Google Sheet:", error);
        container.innerHTML = "<p style='color:red;'>Không thể tải dữ liệu từ Google Sheet. Vui lòng kiểm tra lại kết nối mạng!</p>";
      }
    }

    function openGuide(title, contentText, imgUrl) {
      const modalBody = document.getElementById('modal-body');
      
      let htmlContent = `<h3 style="margin-top:5px; color:#bb86fc;">${title || 'Thông Tin Hướng Dẫn'}</h3>`;
      
      if (contentText) {
        htmlContent += `<div style="font-size: 13px; color: #ddd; text-align: left; line-height: 1.6; margin: 15px 0;">${contentText}</div>`;
      }
      
      if (imgUrl && imgUrl.startsWith('http')) {
        htmlContent += `<img src="${imgUrl}" alt="Ảnh hướng dẫn" style="width:100%; border-radius:12px; margin-top:10px;">`;
      }

      modalBody.innerHTML = htmlContent;
      document.getElementById('guideModal').style.display = 'flex';
    }

    function closeGuide() {
      document.getElementById('guideModal').style.display = 'none';
    }

    window.onclick = function(event) {
      let modal = document.getElementById('guideModal');
      if (event.target == modal) { modal.style.display = "none"; }
    }

    fetchLinksFromSheet();
  </script>
